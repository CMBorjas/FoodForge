<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Food Forge</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Food Forge</h1>
            <p>Upload your recipes in image or PDF format, and we'll extract and catalog them for you!</p>
        </header>
        <main>
            <form id="upload-form" method="POST" enctype="multipart/form-data" action="/upload">
                <label for="file-input">Choose a file:</label>
                <input type="file" id="file-input" name="file" accept=".png, .jpg, .jpeg, .pdf" required>
                <button type="submit" id="upload-button">Upload</button>
            </form>
            <div id="status">
                <!-- Status messages or progress will appear here -->
            </div>
        </main>
        <footer>
            <p>&copy; 2024 Food Forge. All rights reserved.</p>
        </footer>
        <script src="index.js"></script>
    </body>
</html>
